# perf-budget.toml — executable performance law (ROADMAP §5).
#
# Phase applicability: rows marked `phase0 = true` are asserted by
# `cargo xtask bench` TODAY (all deps landed). Phone/relay/sync/handoff rows
# are `phase0 = false` — recorded here so the law is complete from day one,
# enforced when their crates land (bench skips them with a note, never
# silently). A regression is fixed or parked with written justification —
# never silently shipped (PROMPT.md §5.5).

[phase0]
panes = 10
clients = 0
# Phase 0 exit demo (ROADMAP §6): 10 agents, < 100 MB RSS, TUI-less CLI.
max_server_rss_mb = 100

[budgets]
# [metric] phase0, target, unit, notes

# Server RSS @ 30 panes, 5 clients ≤ 120 MB (excl. agents). Phase 0 proves
# the 10-pane point (≤ 100 MB incl. harness); linear extrapolation guards 30.
server_rss_30panes_mb = { phase0 = false, target = 120, unit = "MB" }
server_rss_10panes_mb = { phase0 = true, target = 100, unit = "MB" }
# Per-pane harness overhead ≤ 3 MB hot RAM (ring + VT + journal caps).
per_pane_hot_kb = { phase0 = true, target = 3072, unit = "KB" }
# State detection latency ≤ 200 ms after output (engine is O(bytes), sync).
detection_latency_ms = { phase0 = true, target = 200, unit = "ms" }
# Client reattach across a daemon handoff (T-0038): a live TUI and a live CLI
# attached through a real handoff must be back on the same pane, same pane id,
# in under this. Enforced by the `reattach` slice (`cargo xtask e2e --slice
# reattach`), which reads this row from this file rather than holding a copy —
# the handoff needs live daemons, which `bench` (a load measurement) does not
# provide; same reasoning as `reattach_after_absence_s`.
server_handoff_reattach_s = { phase0 = true, target = 2, unit = "s" }
# 30-pane sampler sweep ≤ 1% CPU at 1 s cadence → ≤ 10 ms wall.
sampler_sweep_30panes_ms = { phase0 = true, target = 300, unit = "ms" }
# VT feed cost: 1-byte feed p99 < 50 ms (guards O(grid-scan) regressions).
vt_feed_1byte_ms = { phase0 = true, target = 50, unit = "ms" }
# Fixture replay determinism: byte-exact, always (no threshold — boolean).
replay_determinism = { phase0 = true, target = 0, unit = "mismatches" }
# Release daemon binary ≤ 20 MB (T-0020 supply chain; enforced by
# `bench --probe size`, which builds --release on demand and caches).
daemon_binary_mb = { phase0 = true, target = 20, unit = "MB" }

# Later phases (recorded, not yet enforced):
phone_cold_attach_s = { phase0 = false, target = 1, unit = "s" }
phone_idle_delta_kbs = { phase0 = false, target = 5, unit = "KB/s" }
# T-0079 gives this row its mechanism and its enforcement: the `tui` slice
# (`cargo xtask e2e --slice tui`) drives the real TUI on a real pty against a
# real daemon holding **30 real panes, each of them working** (the shape that
# made the old serial poll pay two 150 ms blocking `Wait` timeouts per pane —
# 10.3 s before the first correct frame), and times the first frame whose
# sidebar carries all 30 pane ids. The row's number is read from this file, not
# copied, and the measurement is written to `.loop/evidence/T-0079/`.
tui_attach_30panes_ms = { phase0 = true, target = 300, unit = "ms" }
# T-0032 gives this row its mechanism and its enforcement: the `relay` slice
# (`cargo xtask e2e --slice relay`) starts a real relay, a real peer daemon and
# the real TUI, then times a real keypress to the peer's output appearing on
# screen — and reads this row's number rather than a copy of it. Still
# `phase0 = false` because `bench` measures load, and this needs two daemons and
# a relay; the slice is the authority.
cross_machine_attach_s = { phase0 = false, target = 3, unit = "s" }
config_sync_s = { phase0 = false, target = 10, unit = "s" }
# T-0055 gives this row its mechanism: a machine that was away for weeks
# re-attaches (dial, authenticate, drain its durable inbox) and is usable again.
# Asserted by `crates/arreo-relay/tests/inbox.rs`, which reads this row's number
# from this file rather than holding a copy; `phase0 = false` because `bench`
# measures load and this needs a relay plus a moved clock.
reattach_after_absence_s = { phase0 = false, target = 3, unit = "s" }
# T-0030 gives this row its mechanism: a message committed to a device's durable
# inbox is not lost inside the retention window, and every forced drop is counted
# (`dropped_total`/`expired_total`) and reported on the next drain — so a loss is
# observable rather than silent. Asserted today by
# `crates/arreo-relay/tests/inbox.rs` (counters, eviction, expiry, crash
# durability); the end-to-end `relay` slice (T-0034) asserts it across two real
# daemons, which is why it is still `phase0 = false` here — `cargo xtask bench`
# measures load and does not check this row.
queued_loss = { phase0 = false, target = 0, unit = "messages" }
