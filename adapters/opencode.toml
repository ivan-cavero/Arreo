# opencode adapter (T-0017) — universal + native tiers.
#
# Observed shapes (fixtures/opencode-*.pty, opencode 1.18.30):
# - Working: step_start/text/tool_use event flow (--format json).
# - Question (UNIVERSAL text, printed even in --format json runs):
#   "! permission requested: <scope> (<path>); auto-rejecting"
#   (recorded verbatim in opencode-question.pty).
# - Question (NATIVE events, per herdr's live plugin on this box):
#   permission.asked / question.asked → blocked-with-payload;
#   permission.replied / question.replied / question.rejected → working;
#   tool.execute.before/after → working; session.status map
#   (idle/active/busy/pending/retry/running/streaming/working);
#   session.idle → idle; session.error → blocked.
# - Idle: static banner/help.
# - Stress: ?-heavy code in text parts must NOT ask.
#
# Native hook spec: adapters/opencode-native.md (plugin subscribing to the
# events above, reporting StateEvent with the permission payload).

idle_after_ms = 2000
question_after_ms = 2000
blocked_after_ms = 2500
bell_means_attention = true
done_on_exit = true

# T-0072 harness-aware resume, part 1: opencode generates its own session ids
# and its interactive TUI prints none (1.18.30, probed live), so the strategy
# is continuation — `--continue` resumes the last session for this directory
# without an id. When a pane happens to print one (the `--format json` event
# stream carries `"sessionID":"ses_..."`), the engine captures it and the
# record resumes with the exact `--session <id>` instead. `[resume]` itself is
# at the END of this file: a TOML table header captures every key after it,
# and the pattern arrays below are top-level.
harness = "opencode"
programs = ["opencode"]

question_patterns = [
  "\\[y/n\\]",
  "\\(y/n\\)",
  "\\byes\\b.*\\bno\\b",
  # opencode terminal permission line (recorded verbatim).
  "permission requested",
  "permission.*\\?",
  "may i (run|execute|install|delete|modify)",
  "proceed\\?",
  "confirm\\b.*\\?",
  "allow\\?",
  "\\?\\s*$",
  "❯\\s*$",
  "›\\s*$",
]

error_patterns = [
  "Traceback \\(most recent call last\\)",
  "(?m)^(Error|FAILED|FATAL|panic)(:|\\b)",
  "command not found",
  "exit code \\d+",
  "ValueError",
  "TypeError",
  "Segmentation fault",
  # opencode-specific: auto-rejected tool calls + error states.
  "auto-rejecting",
  "\"status\":\"error\"",
]

# T-0072 harness-aware resume, part 2: how the session is resumed. `continue`
# means the harness picks (opencode has no way to be told an id at spawn), so
# the pane resumes by continuation by default and by exact id when the record
# captured one. The pattern watches the `--format json` event stream, the only
# surface opencode prints `ses_…` on (1.18.30).
[resume]
kind = "continue"
argv = ["--continue"]
exact_argv = ["--session", "{session}"]
session_pattern = '"sessionID":"(ses_[A-Za-z0-9]+)"'
