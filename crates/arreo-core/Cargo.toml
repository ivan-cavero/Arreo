[package]
name = "arreo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Device identity (T-0025): ed25519 device keys, pure Rust (no OpenSSL).
# `getrandom` 0.3 is already in the graph via the dev-dependencies, so this
# adds no new version — it only promotes the crate to a shipped dep.
ed25519-dalek = "2"
getrandom = "0.3"
sha2 = "0.10"
portable-pty = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
toml = "0.8"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
base64 = "0.22"
zeroize = "1"
alacritty_terminal = "0.24"
# Pinned: polling 3.11 pulls rustix 1.x while alacritty's rustix-openpty
# needs rustix 0.38 — the mix breaks alacritty's tty/unix.rs on rustc 1.98.
# polling 3.7 unifies on rustix 0.38.44. Revisit on alacritty upgrade.
polling = "=3.7.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util"] }
proptest = "1"

[features]
default = ["sqlite"]
# SQLite rollup store (T-0006). The feature gate lets `check-targets` (T-0010)
# verify all pure-Rust code for foreign targets without an SDK linker, while
# `--no-default-features` skips the C build. CI (real OS runners) always
# builds with default features — the store is never optional in product.
sqlite = ["dep:rusqlite"]
