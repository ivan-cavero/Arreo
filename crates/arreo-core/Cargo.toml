[package]
name = "arreo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Device identity (T-0025): ed25519 device keys, pure Rust (no OpenSSL).
# `getrandom` 0.3 is already in the graph via the dev-dependencies, so this
# adds no new version — it only promotes the crate to a shipped dep.
ed25519-dalek = "2"
getrandom = "0.3"
sha2 = "0.10"
# Pairing (T-0024): SPAKE2 (RFC 9382) over ed25519 — the PAKE is a crate
# because hand-written PAKEs are exactly where crypto dies — plus HMAC for the
# post-PAKE confirmation. `hmac` rides the same `digest` 0.10 tree as `sha2`
# and `curve25519-dalek` was already in the graph via ed25519-dalek.
spake2 = "0.4"
hmac = "0.12"
# Remote transport (T-0023): QUIC via quinn carrying Noise-KK sessions (snow,
# RustCrypto primitives). quinn is pure Rust and tokio-native; rustls is its
# mandatory TLS 1.3 layer, pinned to the `ring` provider — no BoringSSL/OpenSSL
# and no cmake, but note that `ring` does compile C and assembly, so a C
# compiler is required for the *target*. rcgen mints the ephemeral certificate
# TLS uses as a transport detail (the trust anchor is the Noise static key).
#
# All four are optional behind the `transport` feature so a build that does not
# speak the remote path (a local-only daemon, the plugin host) drops the whole
# tree — and so `check-targets` (T-0010) keeps a genuinely C-free surface to
# type-check for foreign targets.
quinn = { version = "0.11", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rcgen = { version = "0.13", optional = true }
snow = { version = "0.9", optional = true }
# Release channel (T-0037): the `https://` transport of `update::channel` is a
# TLS 1.3 client built on the `rustls` above, with the **platform** certificate
# store as its roots. `rustls-native-certs` is already in `Cargo.lock` at 0.8.4
# (via `rustls-platform-verifier`, a dependency of quinn-proto) and already
# exempted in `supply-chain/config.toml`, so this adds no crate to the graph —
# the same standard the `rustix` note above set. It is optional behind the same
# `transport` feature: a build with no TLS refuses an `https` channel URL at
# the point the operator typed it rather than at the first fetch.
rustls-native-certs = { version = "0.8", optional = true }
portable-pty = "0.9"
# PTY adoption (T-0038 stage 0): a master descriptor handed over by the daemon
# being replaced arrives over `SCM_RIGHTS`, which needs `sendmsg`/`recvmsg`
# plus the winsize/tty probes, `fcntl` and `pidfd_open` around it. rustix is
# already in `Cargo.lock` at 0.38.44 via portable-pty (the `polling = "=3.7.0"`
# pin at the bottom is what keeps it at 0.38), so this adds no supply-chain
# entry and no hand-rolled `unsafe libc::sendmsg`.
rustix = { version = "0.38", features = ["alloc", "event", "net", "process", "pty", "termios"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
# Release verification (T-0036): minisign signatures, checked in-process against
# the key committed at `supply-chain/arreo.pub`. `minisign-verify` is the
# *verification* half only — pure Rust, zero dependencies, no build script, no
# network — which is the whole point: signing lives in the release job (with the
# key supplied by the environment), and no code in this workspace can produce a
# signature. See `docs/release.md` for the decision and what was rejected.
minisign-verify = "0.2"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
toml = "0.8"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
base64 = "0.22"
zeroize = "1"
alacritty_terminal = "0.24"
# Pinned: polling 3.11 pulls rustix 1.x while alacritty's rustix-openpty
# needs rustix 0.38 — the mix breaks alacritty's tty/unix.rs on rustc 1.98.
# polling 3.7 unifies on rustix 0.38.44. Revisit on alacritty upgrade.
polling = "=3.7.0"

[dev-dependencies]
# The identity tests cross-check the noise derivation against curve25519-dalek
# directly (an independent path, not a restatement of the implementation).
curve25519-dalek = "4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util"] }
proptest = "1"
# The refusals in `tests/update_verify.rs` are only meaningful if something
# *valid* signed first, and the real key must never be used by a test (never
# sign with it, never commit a secret). So the test writes the minisign format
# itself from `ed25519-dalek` (a shipped dep, used for device identity) and
# `blake2` (already in the graph via spake2) — the supply chain does not grow —
# and the *signing path* is test-only: it lives in the test file, not the
# library, so nothing that ships can produce a signature.
blake2 = "0.10"

[features]
default = ["sqlite", "transport"]
# SQLite rollup store (T-0006). The feature gate lets `check-targets` (T-0010)
# verify all pure-Rust code for foreign targets without an SDK linker, while
# `--no-default-features` skips the C build. CI (real OS runners) always
# builds with default features — the store is never optional in product.
sqlite = ["dep:rusqlite"]
# Remote transport (T-0023): the Noise-QUIC path a paired device connects to.
# On by default — the daemon and the phone both need it — but separable,
# because a local-only build (and the plugin host) has no use for it, and
# because `ring` is a C dependency: dropping this feature is what keeps a
# pure-Rust surface available to `check-targets` for foreign targets.
transport = ["dep:quinn", "dep:rustls", "dep:rcgen", "dep:snow", "dep:rustls-native-certs"]
