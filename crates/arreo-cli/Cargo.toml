[package]
name = "arreo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "arreo"
path = "src/main.rs"

[dependencies]
arreo-core = { version = "0.1.0", path = "../arreo-core" }
# Process-group kill for the abandoned-handoff path (T-0077): `Child::kill` signals
# one pid, so a timed-out candidate's descendants survive it. rustix is already in
# the graph at 0.38.44 (arreo-core's pty adoption uses the same version and feature
# set), so this adds no crate and no supply-chain entry — the same standard the
# `rustls-native-certs` note in arreo-core set. Rejected: a `kill` subprocess
# (PATH-resolved: the one thing a compiled-in safety check must not be) and a
# hand-rolled `libc::kill` (a new dependency plus `unsafe` for one syscall).
rustix = { version = "0.38", features = ["process"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }

[dev-dependencies]
# The device-lifecycle tests assert on `--json` output (T-0025).
serde_json = "1"
