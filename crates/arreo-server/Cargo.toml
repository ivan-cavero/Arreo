[package]
name = "arreo-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "arreo-server"
path = "src/main.rs"

[lib]
name = "arreo_server"
path = "src/lib.rs"

[dependencies]
arreo-core = { version = "0.1.0", path = "../arreo-core" }
# The daemon's configuration file (T-0051) — the same `toml` version the adapter
# registry already uses (T-0004), so this adds no new crate to the graph.
toml = "0.8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal"] }
