[package]
name = "arreo-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "arreo-relay"
path = "src/main.rs"

[lib]
name = "arreo_relay"
path = "src/lib.rs"

[dependencies]
arreo-core = { version = "0.1.0", path = "../arreo-core" }
serde_json = "1"
# The directory is durable relay state (T-0043). Same rusqlite version and the
# same bundled build the session store already uses (T-0018): one SQLite in the
# product, one supply-chain entry, no second store style.
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "2"
# The router (T-0029) is async because the QUIC endpoint is: one task per
# session, and live delivery is a channel per connected device. The transport
# itself comes from arreo-core, so quinn is not named here.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net"] }
