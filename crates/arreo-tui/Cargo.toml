[package]
name = "arreo-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "arreo-tui"
path = "src/main.rs"

[lib]
name = "arreo_tui"
path = "src/lib.rs"

[dependencies]
arreo-core = { version = "0.1.0", path = "../arreo-core" }
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
