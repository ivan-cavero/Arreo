[package]
name = "arreo-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "arreo-tui"
path = "src/main.rs"

[lib]
name = "arreo_tui"
path = "src/lib.rs"

[dependencies]
arreo-core = { version = "0.1.0", path = "../arreo-core" }
anyhow = "1"
# default-features = false keeps the alternates out: ratatui's defaults pull
# the termwiz/termina backends (wezterm-*, pest, palette, uuid…), and this TUI
# talks crossterm and nothing else. Fewer crates also means fewer advisories
# and a smaller vet surface.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "all-widgets", "layout-cache", "underline-color"] }
crossterm = "0.28"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
