body { background: transparent; color: transparent; font-family: ui-monospace, monospace; margin: 2rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: .75rem; }
figure { margin: 0; }
.chip { height: 2.5rem; border: 1px solid transparent; border-radius: 4px; }
figcaption { display: flex; justify-content: space-between; font-size: .8rem; margin-top: .25rem; }
