[workspace]
members = [
    "crates/arreo-core",
    "crates/arreo-server",
    "crates/arreo-cli",
    "crates/arreo-relay",
    "crates/arreo-plugin-api",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/arreo/arreo"
rust-version = "1.98.0"

# Release profile (T-0020): small, fast binaries for the daemon + CLI.
# - opt-level="z": size-first (mobile-core discipline starts here).
# - strip: no symbols in shipped binaries (debuginfo stays in CI artifacts).
# - panic="abort": smaller, and a panicking daemon must crash loudly rather
#   than unwind through PTY threads (chaos-found philosophy: fail loud).
# - lto="thin": cross-crate inline without full-LTO link times.
# - codegen-units=1: slower build, smaller binary (release-only cost).
[profile.release]
opt-level = "z"
strip = true
panic = "abort"
lto = "thin"
codegen-units = 1

# cargo-dist skeleton (T-0020): signed release pipeline for the 3 OSes.
# Installers (sh + PowerShell) point at arreo.dev placeholders until the
# domain serves real artifacts. Signing: Sigstore/minisign at the first real
# release (documented in docs/release.md) — the skeleton produces the
# binaries; trust comes before revenue per the pre-revenue audit gate.
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
installers = ["shell", "powershell"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
install-path = "CARGO_HOME"
tap = "arreo/homebrew-arreo"
publish-jobs = ["release"]
pr-run-mode = "plan"
allow-dirty = ["ci"]
