name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # No toolchain input: respects rust-toolchain.toml (T-0001).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: build
        run: cargo build --workspace --all-targets
      - name: clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (incl. dependency-direction gate)
        run: cargo test --workspace
      - name: conpty-smoke (T-0007 — ConPTY on Windows, portable proxy on unix)
        run: cargo run -p xtask -- conpty-smoke --timeout-secs 60
      - name: xtask stubs
        run: cargo xtask e2e
