name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to the repo's toolchain (T-0063): CI installs `@stable`, the repo
      # pins 1.98.0, and clippy's lint set moves underneath the version — "clippy
      # is clean" meant two different things, which is how the macOS leg broke on
      # lints the pinned clippy never fired. One lint set everywhere now.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: build
        run: cargo build --workspace --all-targets
      - name: clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (incl. dependency-direction gate)
        run: cargo test --workspace
      - name: supply chain (T-0020 — vet + audit + deny, zero findings)
        run: |
          cargo install cargo-vet --locked --version 0.10.0
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-audit --locked --version 0.22.0
          cargo vet --locked
          cargo audit
          cargo deny check
      - name: package + signed-release structure (T-0020/T-0036 — dist plan mode, tag job, pinned key)
        run: cargo run -p xtask -- package --dry-run
      - name: binary size (T-0020 — release daemon ≤ budget)
        run: cargo run -p xtask -- bench --probe size
      - name: cgroup delegation (T-0019 — ubuntu only; macos/windows skip honestly)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # GitHub ubuntu runners permit user delegation (like rootless podman);
          # this dev box (nested harness scope) does not — tests self-skip there.
          sudo mkdir -p /sys/fs/cgroup/arreo-ci
          echo "+memory +pids" | sudo tee /sys/fs/cgroup/arreo-ci/cgroup.subtree_control || true
          cat /sys/fs/cgroup/arreo-ci/cgroup.subtree_control || true
      - name: enforcement (T-0019 — 4GB scenario or loud no-delegation)
        run: cargo run -p xtask -- e2e --slice enforcement
      - name: conpty-smoke (T-0007 — ConPTY on Windows, portable proxy on unix)
        run: cargo run -p xtask -- conpty-smoke --timeout-secs 60
      - name: check-targets (T-0010 — layered portability gate)
        run: cargo run -p xtask -- check-targets
      - name: demo phase0 (T-0021 — exit proof pack; writes PHASE-DONE.md)
        run: cargo run -p xtask -- demo phase0
      - name: lifecycle (T-0012 — SIGTERM drain + crash restart)
        run: cargo run -p xtask -- e2e --slice lifecycle
      - name: adapters (T-0017 — registry lint + fixture replays)
        run: cargo run -p xtask -- adapters --check
      - name: persistence (T-0018 — kill -9 restore + audit)
        run: cargo run -p xtask -- e2e --slice persistence
      - name: "tui (T-0015 — real pty: sidebar, focus, mouse, resize, search, quit)"
        run: cargo run -p xtask -- e2e --slice tui
      - name: "theme (T-0016 — depth fallback proven by the bytes each terminal gets)"
        run: cargo run -p xtask -- e2e --slice theme
      - name: "compat (T-0028 — N−1 window, both directions)"
        run: cargo run -p xtask -- e2e --slice compat
      - name: "mesh (T-0047 — two real daemons + a relay: directory, attach, verbs, trust, isolation)"
        run: cargo run -p xtask -- e2e --slice mesh
      - name: "update (T-0070 — the client swap: daemon and pane counters untouched across it)"
        run: cargo run -p xtask -- e2e --slice update
      - name: xtask stubs
        run: cargo xtask e2e

  # T-0048: the public-readiness gate, as its own job and on one OS.
  #
  # Deliberately overlapping with the matrix above: the matrix proves the product
  # *behaves* on three operating systems, this proves the *repository* is ready to
  # be public — licenses, the whole git history's secrets, the docs' links, the
  # claims. Those are different claims, and a readiness gate that only ran when
  # the matrix was green would be a gate nobody could point at.
  #
  # One OS on purpose: every item here is OS-independent (lint, scan, links), and
  # running a full-history secret scan three times buys nothing.
  public-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # **The whole history.** The secret scan's criterion is that the *log* is
          # clean, not the working tree, and `actions/checkout` is shallow by
          # default — a depth-1 clone would make gitleaks scan one commit and
          # report PASS for a scan it never ran (T-0048).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - name: pinned scanners (gitleaks 8.28.0 + reuse 5.0.2)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          echo "ARREO_GITLEAKS=/tmp/gitleaks" >> "$GITHUB_ENV"
          python3 -m pip install --quiet "reuse==5.0.2"
          echo "ARREO_REUSE=$(command -v reuse)" >> "$GITHUB_ENV"
      - name: release-check (T-0048 — fail closed on any check that cannot run)
        run: cargo run -p xtask -- release-check --public
