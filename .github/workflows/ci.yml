name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # No toolchain input: respects rust-toolchain.toml (T-0001).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: build
        run: cargo build --workspace --all-targets
      - name: clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (incl. dependency-direction gate)
        run: cargo test --workspace
      - name: supply chain (T-0020 — vet + audit + deny, zero findings)
        run: |
          cargo install cargo-vet --locked --version 0.10.0
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-audit --locked --version 0.22.0
          cargo vet --locked
          cargo audit
          cargo deny check
      - name: package skeleton (T-0020 — dist plan mode)
        run: cargo run -p xtask -- package --dry-run
      - name: binary size (T-0020 — release daemon ≤ budget)
        run: cargo run -p xtask -- bench --probe size
      - name: cgroup delegation (T-0019 — ubuntu only; macos/windows skip honestly)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # GitHub ubuntu runners permit user delegation (like rootless podman);
          # this dev box (nested harness scope) does not — tests self-skip there.
          sudo mkdir -p /sys/fs/cgroup/arreo-ci
          echo "+memory +pids" | sudo tee /sys/fs/cgroup/arreo-ci/cgroup.subtree_control || true
          cat /sys/fs/cgroup/arreo-ci/cgroup.subtree_control || true
      - name: enforcement (T-0019 — 4GB scenario or loud no-delegation)
        run: cargo run -p xtask -- e2e --slice enforcement
      - name: conpty-smoke (T-0007 — ConPTY on Windows, portable proxy on unix)
        run: cargo run -p xtask -- conpty-smoke --timeout-secs 60
      - name: check-targets (T-0010 — layered portability gate)
        run: cargo run -p xtask -- check-targets
      - name: demo phase0 (T-0021 — exit proof pack; writes PHASE-DONE.md)
        run: cargo run -p xtask -- demo phase0
      - name: lifecycle (T-0012 — SIGTERM drain + crash restart)
        run: cargo run -p xtask -- e2e --slice lifecycle
      - name: adapters (T-0017 — registry lint + fixture replays)
        run: cargo run -p xtask -- adapters --check
      - name: persistence (T-0018 — kill -9 restore + audit)
        run: cargo run -p xtask -- e2e --slice persistence
      - name: "tui (T-0015 — real pty: sidebar, focus, mouse, resize, search, quit)"
        run: cargo run -p xtask -- e2e --slice tui
      - name: "theme (T-0016 — depth fallback proven by the bytes each terminal gets)"
        run: cargo run -p xtask -- e2e --slice theme
      - name: "compat (T-0028 — N−1 window, both directions)"
        run: cargo run -p xtask -- e2e --slice compat
      - name: xtask stubs
        run: cargo xtask e2e
