name: nightly-bench

# T-0008: nightly load benchmark vs perf-budget.toml. Fails loudly on
# regression (exit non-zero). Results kept as CI artifacts (JSON + table).

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: bench (10 panes vs budget)
        run: cargo run -p xtask -- bench --panes 10 --json | tee bench-${{ matrix.os }}.json
      - name: upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-${{ matrix.os }}.json
